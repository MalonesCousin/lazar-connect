<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Back to Lazar Autopilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Lazar Supplies" width="96" height="96">
  <h1>Taking you back to Lazar Autopilot…</h1>
  <p>If nothing happens, check Lazar Autopilot is open on this PC, then <a id="go" href="http://127.0.0.1:8787/connections">click here</a>.</p>
</main>
<script>
  // AliExpress sent you here after you authorised the app. Pass that straight on to the app on this PC.
  var target = "http://127.0.0.1:8787/oauth/aliexpress/callback" + location.search;
  document.getElementById("go").href = target;
  history.replaceState(null, "", location.pathname);
  location.replace(target);
</script>
</body>
</html>
